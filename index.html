const giraffe = document.getElementById("giraffe");
const message = document.getElementById("message");
const virusWarning = document.getElementById("virusWarning");


/* TEXT TO SPEECH */

function speak(text) {

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 1;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


/* SHOW FAKE VIRUS WARNING */

function showVirusWarning() {

    virusWarning.style.display = "block";

function closeVirusWarning() {

}


/* SHOW GIRAFFE */

function showGiraffe() {

    giraffe.style.display = "block";

    /* Random position */

    const maxX = Math.max(0, window.innerWidth - 170);
    const maxY = Math.max(0, window.innerHeight - 270);

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    giraffe.style.left = randomX + "px";
    giraffe.style.top = randomY + "px";


    /* RANDOM EVENT */

    const randomNumber = Math.random();


    if (randomNumber < 0.20) {

        /*
          20% chance:
          Fake virus warning
        */

        message.textContent = "⚠️ YOU HAVE A VIRUS!";

        showVirusWarning();

    } else {

        /*

          Normal giraffe

        message.textContent = "🦒 Hello there!";

        speak("Hello there!");

    }


    /* Hide giraffe */

    setTimeout(function() {

        giraffe.style.display = "none";

        message.textContent = "Waiting for another giraffe... 🦒";

    }, 2000);


    /* Next appearance */

    const nextTime = Math.random() * 1500 + 500;

    setTimeout(showGiraffe, nextTime);

}


/* START */

    showGiraffe();

}, 1000);

</script>
